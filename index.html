<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowed Blue</title>
    <meta name = "robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="./assets/favicon.png">

    <link rel="stylesheet" href="./assets/Fonts/fonts.css">

    <style>
        html {
            background: black;
        }

        body {
            font-family: 'providence-sans';
        }

        /* ---------- Loading screen (the Lounge sets body[loaded]) ---------- */
        body:not([loaded]) * {
            display: none !important;
        }

        body:after {
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease-in-out opacity;
            position: fixed;
            inset: 0;
            content: " ";
            background-image: linear-gradient(#4f5ccf, #191619);
            z-index: 9999;
        }

        body:not([loaded])::after {
            opacity: 1;
        }

        /* ---------- Lab zone ---------- */
        game-main[zone="lab"] {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 3em;
            letter-spacing: 0.3em;
            word-break: break-all;
            text-align: justify;
            color: rgb(242, 241, 241);
        }
        /* Not while the FullscreenManager needs the document to scroll
           (html.fs-scroll); it blocks scrolling itself once the bars are gone. */
        html:not(.fs-scroll) body:has(game-main[zone="lab"]) {
            overflow: hidden;
        }

        lab-scene {
            display: block;
            position: fixed;
            /* Fill exactly the visible viewport (the same box the fixed crosshair
               is centred in), so the raycast lines up with the crosshair on mobile. */
            inset: 0;
            overflow: hidden;
        }
        lab-scene canvas {
            display: block;
        }

        #promts {
            border-radius: 1em;
            position: absolute;
            top: 1em;
            left: 50%;
            background: #3e3e3e70;
            z-index: 10000;
            letter-spacing: 0.05em;
            padding: 0.5em;
            transform: translate(-50%, 0);
            transition: 0.3s ease-in-out opacity;
        }
        #promts:empty {
            opacity: 0;
        }

        .cross-hair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 10000;
            /* Let taps/clicks on the crosshair reach the scene underneath. */
            pointer-events: none;
        }
    </style>
</head>

<body>
    <game-main></game-main>
</body>

<script type="module">
    import { GameMain } from "./src/game-main.js";
    await GameMain.load();
</script>
</html>
